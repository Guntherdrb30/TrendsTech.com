<svg width="720" height="210" viewBox="0 0 720 210" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="210" fill="white"/>

  <defs>
    <linearGradient id="moonGrad" x1="28" y1="38" x2="148" y2="178" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2DE0CC"/>
      <stop offset="100%" stop-color="#0A9480"/>
    </linearGradient>
    <mask id="crescentMask">
      <rect width="720" height="210" fill="black"/>
      <circle cx="90" cy="110" r="74" fill="white"/>
      <circle cx="118" cy="91" r="61" fill="black"/>
    </mask>
  </defs>

  <!-- Crescent moon body -->
  <circle cx="90" cy="110" r="74" fill="url(#moonGrad)" mask="url(#crescentMask)"/>

  <!-- 4-point sparkle star inside crescent opening -->
  <path d="M119 46 L122.5 59 L136 62 L122.5 65 L119 78 L115.5 65 L102 62 L115.5 59 Z" fill="#2DE0CC" opacity="0.90"/>

  <!-- LUNA wordmark — heavy dark navy -->
  <text
    x="178"
    y="140"
    font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
    font-size="94"
    font-weight="900"
    fill="#0D1B2A"
    letter-spacing="-2"
  >LUNA</text>

  <!-- Teal accent dot below/inside the A -->
  <circle cx="618" cy="155" r="6" fill="#0A9480"/>

  <!-- ERP inteligente subtitle -->
  <text
    x="182"
    y="178"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-size="17"
    font-weight="300"
    fill="#94A3B8"
    letter-spacing="6"
  >ERP inteligente</text>
</svg>
