name: Repair security lockfile (isolated branch)
on:
  push:
    branches: [fix/security-dependencies-20261017]
    paths:
      - '.github/workflows/security-lockfile-repair.yml'
      - 'package.json'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Refresh vulnerable compatible transitive dependencies
        run: |
          npm audit fix --package-lock-only --ignore-scripts --no-fund || true
          npm install --package-lock-only --ignore-scripts --no-fund
      - name: Verify lockfile against manifests
        run: npm ci --ignore-scripts --no-fund
      - name: Record lockfile changes on isolated branch
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "fix(security): regenerate compatible production dependency lockfile"
            git push origin HEAD:fix/security-dependencies-20261017
          fi
