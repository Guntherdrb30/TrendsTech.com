name: Studio mobile memory checks
on:
  push:
    branches: [feature/trends-mcp-project-memory-consent-20261017]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AUTH_SECRET: ci-only-auth-secret-at-least-32-characters
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-at-least-32-characters
      NEXT_PUBLIC_SITE_URL: https://trends172tech.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test mobile memory contracts
        run: npx tsx --test apps/web/tests/mcp/studio-memory-contract.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Full MCP security contract tests
        run: npm run security:test
      - name: Build
        run: npm run build
